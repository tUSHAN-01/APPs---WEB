<script>
const $=id=>document.getElementById(id);
const dec=id=>{const e=$(id);if(!e)return"";const bin=atob(e.textContent),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)};
const cache={};let workerUrl=null;
const lib=n=>cache[n]||(cache[n]=dec("L_"+n.replace(/\./g,"_")));
function build(k){
  let s=dec("P_"+k);
  s=s.replace(/<script data-lib="([^"]+)"><\/script>/g,(_,n)=>"<script>"+lib(n).replace(/<\/script/gi,"<\\/script")+"<\/script>");
  if(s.includes("pdf.worker.min.js")){
    workerUrl=workerUrl||URL.createObjectURL(new Blob([lib("pdf.worker.min.js")],{type:"text/javascript"}));
    s=s.replace(/https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/pdf\.js\/[\d.]+\/pdf\.worker\.min\.js/g,workerUrl);
  }
  return s;
}
const frames={};
function show(k){
  document.querySelectorAll("header button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  for(const f in frames)frames[f].classList.toggle("on",f===k);
  if(!frames[k]){const f=document.createElement("iframe");f.srcdoc=build(k);$("m").appendChild(f);frames[k]=f;f.classList.add("on")}
  try{history.replaceState(null,"","#"+k)}catch(e){}
}
document.querySelectorAll("header button").forEach(b=>b.onclick=()=>show(b.dataset.k));
show(location.hash.slice(1)&&$("P_"+location.hash.slice(1))?location.hash.slice(1):"fb");
</script></body></html>
