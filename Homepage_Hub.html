<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homepage Hub</title>
<style>
:root{--bg:#f4f4f6;--fg:#1c1c22;--mut:#6d6d78;--card:#fff;--line:rgba(0,0,0,.12);--acc:#4f6bff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#15151a;--fg:#ececf1;--mut:#9a9aa6;--card:#202027;--line:rgba(255,255,255,.14)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#stage iframe.on{display:block}
#bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:.4;transition:opacity .2s}
#bar:hover,#bar:focus-within,body.open #bar{opacity:1}
@media(hover:none){#bar{opacity:.85}}
#bar button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:999px;padding:6px 10px}
#bar button:hover{background:var(--line)}
#nm{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#ct{color:var(--mut);font-size:12px;margin-left:6px;font-weight:400}
#panel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,10,16,.5);backdrop-filter:blur(4px)}
body.open #panel{display:flex}
#sheet{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px}
#sheet h1{margin:0 0 2px;font-size:18px}
#sheet p{margin:0 0 14px;color:var(--mut);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{position:relative;display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.dot{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700}
.card b{display:block;padding-right:22px}
.card span.d{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.card i{font-style:normal;color:var(--mut);font-size:11px;margin-left:6px}
.pin{position:absolute;top:6px;right:8px;font-size:16px;color:var(--mut);background:none;border:0;cursor:pointer;padding:2px 4px}
.pin.on{color:#e8a200}
#foot{margin-top:12px;color:var(--mut);font-size:12px}
kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--card)}
</style>
</head>
<body>
<div id="stage"></div>

<div id="bar" role="toolbar" aria-label="Switch home view">
  <button id="prev" title="Previous view (Alt+[)" aria-label="Previous view">‹</button>
  <button id="pick" title="Choose a view (Alt+V)"><span id="nm"></span><span id="ct"></span></button>
  <button id="next" title="Next view (Alt+])" aria-label="Next view">›</button>
</div>

<div id="panel" role="dialog" aria-modal="true" aria-label="Choose home view">
  <div id="sheet">
    <h1>Choose your home view</h1>
    <p>Your pick is remembered. Tap the star on a card to always start with that view.</p>
    <div id="grid"></div>
    <div id="foot"><kbd>Alt</kbd>+<kbd>1</kbd>–<kbd>0</kbd> jump to a view · <kbd>Alt</kbd>+<kbd>V</kbd> open this picker · <kbd>Alt</kbd>+<kbd>[</kbd> / <kbd>]</kbd> previous / next · <kbd>Esc</kbd> close</div>
  </div>
</div>

const $ = s => document.querySelector(s);
const LAST = 'hub:last', PIN = 'hub:pin';
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const put = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const frames = {};
let cur = -1;

function show(i, remember = true) {
  i = (i + VIEWS.length) % VIEWS.length;
  const v = VIEWS[i];
  Object.values(frames).forEach(f => f.classList.remove('on'));
  let f = frames[v.id];
  if (!f) {
    f = document.createElement('iframe');
    f.title = v.name;
    f.setAttribute('allow', 'clipboard-write');
    f.addEventListener('load', () => { try { f.contentWindow.addEventListener('keydown', onKey); } catch (e) {} });
    f.srcdoc = dec(v.b);
    $('#stage').append(f);
    frames[v.id] = f;
  }
  f.classList.add('on');
  cur = i;
  $('#nm').textContent = v.name;
  $('#ct').textContent = (i + 1) + ' / ' + VIEWS.length;
  document.title = v.name;
  if (remember) { put(LAST, v.id); try { history.replaceState(null, '', '#' + v.id); } catch (e) {} }
  render();
}

function render() {
  const pin = get(PIN);
  $('#grid').innerHTML = '';
  VIEWS.forEach((v, i) => {
    const c = document.createElement('div');
    c.style.position = 'relative';
    const b = document.createElement('button');
    b.className = 'card' + (i === cur ? ' cur' : '');
    b.style.width = '100%';
    b.innerHTML = '<div class="dot" style="background:' + v.c + '">' + v.name.trim()[0] + '</div>' +
      '<div><b>' + v.name + '<i>' + ((i + 1) % 10) + '</i></b><span class="d">' + v.desc + '</span></div>';
    b.onclick = () => { show(i); close(); };
    const p = document.createElement('button');
    p.className = 'pin' + (pin === v.id ? ' on' : '');
    p.textContent = pin === v.id ? '★' : '☆';
    p.title = pin === v.id ? 'Default start view (click to clear)' : 'Always start with this view';
    p.onclick = e => { e.stopPropagation(); put(PIN, pin === v.id ? null : v.id); render(); };
    c.append(b, p);
    $('#grid').append(c);
  });
}

const open = () => document.body.classList.add('open');
const close = () => document.body.classList.remove('open');
const toggle = () => document.body.classList.toggle('open');

function onKey(e) {
  if (e.key === 'Escape') close();
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  const m = /^Digit(\d)$/.exec(e.code);
  if (m) {
    const n = (+m[1] + 9) % 10;
    if (n < VIEWS.length) { e.preventDefault(); show(n); }
  } else if (e.code === 'KeyV') { e.preventDefault(); toggle(); }
  else if (e.code === 'BracketLeft') { e.preventDefault(); show(cur - 1); }
  else if (e.code === 'BracketRight') { e.preventDefault(); show(cur + 1); }
}

addEventListener('keydown', onKey);
$('#prev').onclick = () => show(cur - 1);
$('#next').onclick = () => show(cur + 1);
$('#pick').onclick = toggle;
$('#panel').addEventListener('mousedown', e => { if (e.target.id === 'panel') close(); });
addEventListener('hashchange', () => {
  const i = VIEWS.findIndex(v => v.id === location.hash.slice(1));
  if (i >= 0 && i !== cur) show(i);
});

const find = id => VIEWS.findIndex(v => v.id === id);
let start = find(location.hash.slice(1));
if (start < 0) start = find(get(PIN));
if (start < 0) start = find(get(LAST));
show(start < 0 ? 0 : start, false);
</script>
