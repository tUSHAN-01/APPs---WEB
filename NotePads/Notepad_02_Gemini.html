<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Keep</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #e0e0e0;
            --note-bg: #ffffff;
            --hover-bg: #f1f3f4;
            --yellow: #fff475;
            --green: #ccff90;
            --turquoise: #a7ffeb;
            --blue: #cbf0f8;
            --red: #f28b82;
            --purple: #d7aefb;
            --pink: #fdcfe8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #202124;
                --sidebar-bg: #202124;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border-color: #5f6368;
                --note-bg: #202124;
                --hover-bg: #28292c;
                /* Dark mode specific note colors would go here, keeping simple for now */
            }
        }

        * { box-sizing: border-box; outline: none; }
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 80px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            transition: width 0.3s;
        }
        #sidebar:hover { width: 280px; }
        
        .nav-item {
            width: 90%;
            height: 48px;
            display: flex;
            align-items: center;
            padding-left: 24px;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        .nav-item:hover, .nav-item.active { background-color: var(--hover-bg); }
        .nav-item span { margin-left: 20px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; font-weight: 500;}
        #sidebar:hover .nav-item span { opacity: 1; }
        
        /* --- Main Area --- */
        #main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* --- Header --- */
        header {
            padding: 8px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .search-bar {
            background: var(--hover-bg);
            border-radius: 8px;
            padding: 10px 20px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            background: transparent;
            border: none;
            width: 100%;
            margin-left: 10px;
            font-size: 16px;
            color: var(--text-primary);
        }

        /* --- Input Area --- */
        #create-note {
            width: 600px;
            margin: 30px auto;
            background: var(--note-bg);
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 2px 6px 2px rgba(60,64,67,0.15);
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }
        #create-note input, #create-note textarea {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-primary);
            display: block;
            resize: none;
        }
        #note-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: none;
        }
        #note-text {
            font-size: 14px;
            height: 24px;
        }
        #create-note.expanded #note-title { display: block; }
        #create-note.expanded #note-text { height: auto; min-height: 100px; }
        #form-actions {
            display: none;
            justify-content: space-between;
            margin-top: 10px;
        }
        #create-note.expanded #form-actions { display: flex; }

        /* --- Notes Grid --- */
        .notes-container {
            padding: 20px 50px;
            column-count: 4; 
            column-gap: 15px;
        }
        @media (max-width: 1100px) { .notes-container { column-count: 3; } }
        @media (max-width: 800px) { .notes-container { column-count: 2; } }
        @media (max-width: 500px) { .notes-container { column-count: 1; } }

        .note-card {
            background: var(--note-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px; /* Spacing for masonry */
            break-inside: avoid; /* Prevents splitting across columns */
            position: relative;
            transition: box-shadow 0.2s;
        }
        .note-card:hover {
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        .note-card:hover .note-actions { opacity: 1; }

        .n-title { font-weight: bold; margin-bottom: 8px; font-size: 16px; }
        .n-body { white-space: pre-wrap; font-size: 14px; line-height: 1.4; color: var(--text-primary); }
        
        .note-actions {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            transition: opacity 0.2s;
            gap: 10px;
        }
        
        button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            color: var(--text-secondary);
        }
        button:hover { background-color: rgba(95,99,104,0.1); color: var(--text-primary); }

        .section-label {
            width: 100%;
            padding: 0 50px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-secondary);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Color Palette */
        .color-picker {
            position: absolute;
            bottom: 35px;
            background: white;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 5px;
            display: none;
            gap: 5px;
            z-index: 10;
        }
        .color-circle { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; }
        
        .empty-state {
            text-align: center;
            margin-top: 100px;
            color: var(--text-secondary);
        }
        .empty-state svg { width: 100px; height: 100px; fill: var(--border-color); }

    </style>
</head>
<body>

    <div id="sidebar">
        <div class="nav-item active" onclick="setView('notes')">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z" fill="currentColor"/></svg>
            <span>Notes</span>
        </div>
        <div class="nav-item" onclick="setView('archive')">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm11-5.5l-4 4-4-4 1.41-1.41L11 13.67V10h2v3.67l1.59-1.59L16 13.5z" fill="currentColor"/></svg>
            <span>Archive</span>
        </div>
        <div class="nav-item" onclick="setView('trash')">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 4V3H9v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5zm2 15H7V6h10v13zM9 8h2v9H9zm4 0h2v9h-2z" fill="currentColor"/></svg>
            <span>Trash</span>
        </div>
    </div>

    <div id="main">
        <header>
            <div class="search-bar">
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#5f6368"/></svg>
                <input type="text" placeholder="Search" id="search-input" onkeyup="renderNotes()">
            </div>
        </header>

        <div id="create-note" class="">
            <input type="text" id="note-title" placeholder="Title">
            <textarea id="note-text" placeholder="Take a note..." onclick="expandForm()"></textarea>
            <div id="form-actions">
                <div></div> <button style="font-weight: bold; padding: 5px 15px; border-radius: 4px;" onclick="addNote()">Close</button>
            </div>
        </div>

        <div id="pinned-label" class="section-label" style="display:none">Pinned</div>
        <div id="pinned-container" class="notes-container"></div>
        
        <div id="others-label" class="section-label" style="display:none">Others</div>
        <div id="notes-container" class="notes-container"></div>
    </div>

    <script>
        // --- Data & State ---
        let notes = JSON.parse(localStorage.getItem('localKeepNotes')) || [];
        let currentView = 'notes'; // notes, archive, trash
        
        // --- Core Functions ---

        function save() {
            localStorage.setItem('localKeepNotes', JSON.stringify(notes));
            renderNotes();
        }

        function createId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function expandForm() {
            document.getElementById('create-note').classList.add('expanded');
        }

        function collapseForm() {
            document.getElementById('create-note').classList.remove('expanded');
            document.getElementById('note-title').value = '';
            document.getElementById('note-text').value = '';
        }

        function addNote() {
            const title = document.getElementById('note-title').value;
            const text = document.getElementById('note-text').value;

            if (title.trim() || text.trim()) {
                notes.unshift({
                    id: createId(),
                    title: title,
                    text: text,
                    color: '#ffffff',
                    isPinned: false,
                    isArchived: false,
                    isTrashed: false,
                    timestamp: Date.now()
                });
                save();
            }
            collapseForm();
        }

        // --- Action Functions ---

        function togglePin(id) {
            const note = notes.find(n => n.id === id);
            note.isPinned = !note.isPinned;
            save();
        }

        function toggleArchive(id) {
            const note = notes.find(n => n.id === id);
            note.isArchived = !note.isArchived;
            note.isPinned = false; // Unpin if archiving
            note.isTrashed = false;
            save();
        }

        function moveToTrash(id) {
            const note = notes.find(n => n.id === id);
            note.isTrashed = true;
            save();
        }

        function restoreFromTrash(id) {
            const note = notes.find(n => n.id === id);
            note.isTrashed = false;
            save();
        }

        function deletePermanently(id) {
            notes = notes.filter(n => n.id !== id);
            save();
        }

        function setColor(id, color) {
            const note = notes.find(n => n.id === id);
            note.color = color;
            save();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            // Very basic selection highlighting, finding by text content mostly
            const items = document.querySelectorAll('.nav-item');
            if(view === 'notes') items[0].classList.add('active');
            if(view === 'archive') items[1].classList.add('active');
            if(view === 'trash') items[2].classList.add('active');
            
            // Hide create bar in trash/archive
            document.getElementById('create-note').style.display = view === 'notes' ? 'block' : 'none';
            
            renderNotes();
        }

        // --- Rendering ---

        function renderNotes() {
            const pinnedContainer = document.getElementById('pinned-container');
            const mainContainer = document.getElementById('notes-container');
            const pinnedLabel = document.getElementById('pinned-label');
            const othersLabel = document.getElementById('others-label');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();

            pinnedContainer.innerHTML = '';
            mainContainer.innerHTML = '';

            // Filter based on View & Search
            let visibleNotes = notes.filter(note => {
                const matchesSearch = note.title.toLowerCase().includes(searchTerm) || note.text.toLowerCase().includes(searchTerm);
                if (!matchesSearch) return false;

                if (currentView === 'notes') return !note.isTrashed && !note.isArchived;
                if (currentView === 'archive') return !note.isTrashed && note.isArchived;
                if (currentView === 'trash') return note.isTrashed;
            });

            const pinnedNotes = visibleNotes.filter(n => n.isPinned);
            const otherNotes = visibleNotes.filter(n => !n.isPinned);

            // Logic to show/hide "Pinned" and "Others" labels
            if (currentView === 'notes' && pinnedNotes.length > 0) {
                pinnedLabel.style.display = 'block';
                othersLabel.style.display = 'block';
                // Render Pinned
                pinnedNotes.forEach(note => pinnedContainer.appendChild(createNoteElement(note)));
            } else {
                pinnedLabel.style.display = 'none';
                othersLabel.style.display = 'none';
            }

            // Render Others (or all if archive/trash)
            otherNotes.forEach(note => mainContainer.appendChild(createNoteElement(note)));

            if (visibleNotes.length === 0) {
                mainContainer.innerHTML = `<div class="empty-state">No notes found</div>`;
            }
        }

        function createNoteElement(note) {
            const div = document.createElement('div');
            div.className = 'note-card';
            div.style.backgroundColor = note.color;
            if(note.color !== '#ffffff' && note.color !== '#202124') {
                div.style.border = 'none'; // Remove border for colored notes for cleaner look
            }

            // Icons
            const pinIcon = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M16 9V4l1 0c.55 0 1-.45 1-1s-.45-1-1-1H7C6.45 1 6 1.45 6 2s.45 1 1 1l1 0v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z" fill="currentColor"/></svg>`;
            const archiveIcon = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM6.24 5h11.52l.83 1H5.42l.82-1zM5 19V8h14v11H5zm11-5.5l-4 4-4-4 1.41-1.41L11 13.67V10h2v3.67l1.59-1.59L16 13.5z" fill="currentColor"/></svg>`;
            const trashIcon = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>`;
            const restoreIcon = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M14 14h2l-4-4-4 4h2v4h4v-4zM6 7v12c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V7H6zm12 12H6V9h12v10z" fill="currentColor"/></svg>`;
            const colorIcon = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="currentColor"/></svg>`;

            // Buttons based on View
            let btns = '';
            if (currentView === 'trash') {
                btns = `
                    <button onclick="deletePermanently('${note.id}')" title="Delete Forever">${trashIcon}</button>
                    <button onclick="restoreFromTrash('${note.id}')" title="Restore">${restoreIcon}</button>
                `;
            } else {
                btns = `
                    <div style="position:relative; display:inline-block">
                        <button onclick="toggleColorPicker(this)" title="Color">${colorIcon}</button>
                        <div class="color-picker" onmouseleave="this.style.display='none'">
                            <div class="color-circle" style="background:#ffffff" onclick="setColor('${note.id}', '#ffffff')"></div>
                            <div class="color-circle" style="background:#f28b82" onclick="setColor('${note.id}', '#f28b82')"></div>
                            <div class="color-circle" style="background:#fbbc04" onclick="setColor('${note.id}', '#fbbc04')"></div>
                            <div class="color-circle" style="background:#fff475" onclick="setColor('${note.id}', '#fff475')"></div>
                            <div class="color-circle" style="background:#ccff90" onclick="setColor('${note.id}', '#ccff90')"></div>
                            <div class="color-circle" style="background:#a7ffeb" onclick="setColor('${note.id}', '#a7ffeb')"></div>
                            <div class="color-circle" style="background:#cbf0f8" onclick="setColor('${note.id}', '#cbf0f8')"></div>
                            <div class="color-circle" style="background:#aecbfa" onclick="setColor('${note.id}', '#aecbfa')"></div>
                            <div class="color-circle" style="background:#d7aefb" onclick="setColor('${note.id}', '#d7aefb')"></div>
                        </div>
                    </div>
                    <button onclick="toggleArchive('${note.id}')" title="Archive">${archiveIcon}</button>
                    <button onclick="moveToTrash('${note.id}')" title="Delete">${trashIcon}</button>
                `;
            }

            const pinBtn = (currentView === 'notes') ? 
                `<button onclick="togglePin('${note.id}')" style="position:absolute; top:10px; right:10px; opacity:${note.isPinned ? 1 : 0};" class="pin-btn">${pinIcon}</button>` : '';

            div.innerHTML = `
                ${pinBtn}
                <div class="n-title">${note.title}</div>
                <div class="n-body">${note.text}</div>
                <div class="note-actions">
                    ${btns}
                </div>
            `;
            
            // Hover logic for pin
            if(currentView === 'notes') {
                div.addEventListener('mouseenter', () => { div.querySelector('.pin-btn').style.opacity = 1; });
                div.addEventListener('mouseleave', () => { if(!note.isPinned) div.querySelector('.pin-btn').style.opacity = 0; });
            }

            return div;
        }

        function toggleColorPicker(btn) {
            const picker = btn.nextElementSibling;
            picker.style.display = 'flex';
        }

        // Initialize
        renderNotes();

        // Close input on outside click
        document.addEventListener('click', function(event) {
            const createNote = document.getElementById('create-note');
            const isClickInside = createNote.contains(event.target);
            const isButton = event.target.tagName === 'BUTTON' || event.target.closest('button');
            
            if (!isClickInside && !isButton) {
                if(document.getElementById('note-title').value !== '' || document.getElementById('note-text').value !== '') {
                    addNote(); // Auto save if clicking away
                } else {
                    collapseForm();
                }
            }
        });

    </script>
</body>
</html>
