const bar=document.getElementById('bar'),grid=document.getElementById('grid'),f=document.getElementById('f'),home=document.getElementById('home');
function dec(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
function mark(i){[...bar.children].forEach((b,j)=>b.classList.toggle('on',j===i+1))}
function show(i){
  if(i<0){f.style.display='none';f.srcdoc='';home.style.display='block';mark(-1);return}
  home.style.display='none';f.style.display='block';f.srcdoc=dec(APPS[i].data);mark(i);
  f.onload=()=>f.contentWindow.focus();
}
const hb=document.createElement('button');hb.textContent='🏠 Home';hb.onclick=()=>show(-1);bar.appendChild(hb);
APPS.forEach((a,i)=>{
  const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>show(i);bar.appendChild(b);
  const c=document.createElement('div');c.className='card';c.textContent=a.name;c.onclick=()=>show(i);grid.appendChild(c);
});
mark(-1);
</script></body></html>
